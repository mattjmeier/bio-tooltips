name: Update README Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'screenshots/**'
      - 'benchmark/fixtures/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  capture:
    name: Capture Tooltips Screenshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build library
        run: npm run build:js-css

      - name: Capture screenshots
        run: xvfb-run -a node screenshots/capture.mjs

      - name: Commit updated screenshots (if changed)
        run: |
          git add assets/preview*.png

          if git diff --cached --quiet; then
            echo "Screenshots unchanged, nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update README tooltip screenshots"
            git push
          fi