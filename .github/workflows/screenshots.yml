name: Update README Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Only the newest main-branch state should be rendered. A push made with this
# workflow's GITHUB_TOKEN does not start another workflow run, so the screenshot
# commit itself cannot create an infinite loop.
concurrency:
  group: readme-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    name: Capture Tooltips Screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build library
        run: npm run build:js-css

      - name: Capture screenshots
        run: xvfb-run -a node screenshots/capture.mjs

      - name: Commit updated screenshots (if changed)
        run: |
          git add assets/preview*.png

          if git diff --cached --quiet; then
            echo "Screenshots unchanged, nothing to commit."
          else
            # Never put screenshots rendered from an older revision on top of
            # newer source. Because every main push starts this workflow, the
            # newer run will render and commit the current state instead.
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo "::error::main advanced while screenshots were rendering; the newer run will regenerate them."
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update README tooltip screenshots"
            git push origin HEAD:main
          fi