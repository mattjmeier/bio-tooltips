name: Refresh Performance Results

on:
  workflow_dispatch:
    inputs:
      include_stress:
        description: Include 1,000 elements / 800 IDs (large live GeneRIF downloads)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmark-results
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'mattjmeier/bio-tooltips'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    env:
      BENCH_BROWSER_TRIALS: '30'
      BENCH_BROWSER_LIVE_TRIALS: '30'
      BENCH_BROWSER_WARMUPS: '2'
      BENCH_BROWSER_LIVE_WARMUPS: '2'
      BENCH_BROWSER_NETWORK_LABEL: GitHub-hosted Ubuntu runner (network/location unspecified)
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build library
        run: npm run build:js-css

      - name: Measure HTML rendering
        run: node benchmark/run.mjs

      - name: Measure fixture browser interactions
        run: node benchmark/browser.mjs --fixtures

      - name: Measure live browser interactions
        run: node benchmark/browser.mjs

      - name: Measure fixture stress workload
        if: inputs.include_stress
        run: node benchmark/browser.mjs --fixtures --stress

      - name: Measure live stress workload
        if: inputs.include_stress
        run: node benchmark/browser.mjs --stress

      - name: Refresh published snapshot
        run: npm run benchmark:publish-results

      - name: Validate snapshot and presentation
        run: npm test -- --run test/benchmark-report.test.ts test/benchmark-snapshot.test.ts

      - name: Build docs without regenerating API reference
        run: npm run docs:build

      - name: Propose results update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet -- benchmark/published/latest.json; then
            echo "Published results are unchanged."
            exit 0
          fi
          BRANCH="automation/benchmark-results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark/published/latest.json
          git commit -m 'docs: refresh performance results'
          git push origin "$BRANCH"
          cat > "$RUNNER_TEMP/benchmark-pr.md" <<'BODY'
          Refresh the published renderer, live API and fixture benchmark summaries.

          The snapshot records run dates, environment, settings and input hashes. Live measurements describe this GitHub runner and network; they are not service guarantees. Review the measurements before merging.

          Validation: focused benchmark tests and the VitePress docs build passed in the refresh workflow. No generated API documentation was changed.
          BODY
          gh pr create --base main --head "$BRANCH" --title 'docs: refresh performance results' --body-file "$RUNNER_TEMP/benchmark-pr.md"
