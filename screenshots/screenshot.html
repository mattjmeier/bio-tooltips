<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bio Tooltips Screenshot</title>
    <link rel="stylesheet" href="../dist/bio-tooltips.css">
    <script>
        // Set the page chrome theme from ?theme=dark before first paint so the
        // body background and card colors render correctly from the first frame.
        (function () {
            var theme = new URLSearchParams(window.location.search).get('theme') === 'dark' ? 'dark' : 'light';
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #ffffff;
            --card-bg: #f8fafc;
            --card-border: #e2e8f0;
            --card-heading: #64748b;
            --trigger: #1e293b;
            --trigger-hover: #2563eb;
        }
        /* Palette mirrors GitHub's dark canvas so the dark capture blends into
           the surrounding README page in dark mode. */
        html[data-theme="dark"] {
            --bg: #0d1117;
            --card-bg: #161b22;
            --card-border: #30363d;
            --card-heading: #8b949e;
            --trigger: #e6edf3;
            --trigger-hover: #58a6ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            padding: 50px 60px;
            display: flex;
            gap: 300px;
            align-items: flex-start;
        }
        .trigger-card {
            padding: 24px 32px;
            border-radius: 12px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
        }
        .trigger-card h2 {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--card-heading);
            margin-bottom: 12px;
        }
        .trigger-word {
            font-size: 18px;
            font-weight: 500;
            color: var(--trigger);
            cursor: pointer;
        }
        .trigger-word:hover {
            color: var(--trigger-hover);
        }
    </style>
</head>
<body>
    <div class="trigger-card gene-card">
        <h2>Gene (MyGene.info)</h2>
        <span class="gene-tooltip trigger-word" data-species="human">TP53</span>
    </div>
    <div class="trigger-card chemical-card">
        <h2>Chemical (MyChem.info)</h2>
        <span class="chemical-tooltip trigger-word" data-query="2244" data-scope="pubchem">aspirin</span>
    </div>

    <script src="../node_modules/d3/dist/d3.min.js"></script>
    <script src="../node_modules/ideogram/dist/js/ideogram.min.js"></script>
    <script src="../dist/bio-tooltips.global.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const theme = new URLSearchParams(window.location.search).get('theme') === 'dark' ? 'dark' : 'light';
            GeneTooltip.init({
                truncateSummary: 3,
                display: {
                    ideogram: true,
                    geneTrack: 'expanded',
                },
                ideogram: { enabled: true, height: 100 },
                tooltipHeight: 480,
                tooltipWidth: 420,
                theme
            });
            ChemicalTooltip.init({
                tooltipHeight: 420,
                tooltipWidth: 420,
                theme
            });
        });
    </script>
</body>
</html>
