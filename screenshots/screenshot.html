<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bio Tooltips Screenshot</title>
    <link rel="stylesheet" href="../dist/bio-tooltips.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            padding: 40px;
            display: flex;
            gap: 80px;
            align-items: flex-start;
        }
        .trigger-card {
            padding: 24px 32px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .trigger-card h2 {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 12px;
        }
        .trigger-word {
            font-size: 18px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
        }
        .trigger-word:hover {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="trigger-card">
        <h2>Gene (MyGene.info)</h2>
        <span class="gene-tooltip trigger-word" data-species="human">TP53</span>
    </div>
    <div class="trigger-card">
        <h2>Chemical (MyChem.info)</h2>
        <span class="chemical-tooltip trigger-word" data-query="2244" data-scope="pubchem">aspirin</span>
    </div>

    <script src="../node_modules/d3/dist/d3.min.js"></script>
    <script src="../node_modules/ideogram/dist/js/ideogram.min.js"></script>
    <script src="../dist/bio-tooltips.global.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            GeneTooltip.init({
                truncateSummary: 3,
                display: { ideogram: true },
                ideogram: { enabled: true, height: 100 },
                tooltipHeight: 360,
                tooltipWidth: 420,
                theme: 'light'
            });
            ChemicalTooltip.init({
                tooltipHeight: 360,
                tooltipWidth: 420,
                theme: 'light'
            });
        });
    </script>
</body>
</html>
